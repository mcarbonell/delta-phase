name: DeltaPhase CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pytest

    - name: Run Pytest Suite (CPU)
      run: |
        pytest tests/test_core.py tests/test_equivalence.py tests/test_rigorous_equivalence.py tests/test_smoke_mqar.py tests/test_smoke_niah.py tests/test_triton_dispatcher.py
