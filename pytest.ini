[pytest]
testpaths = tests
pythonpath = .
python_files =
    test_core.py
    test_equivalence.py
    test_rigorous_equivalence.py
    test_integrated_cores.py
    test_smoke_mqar.py
    test_smoke_niah.py
    test_triton_dispatcher.py
    test_amp_dtypes.py
    test_laplace_chunkwise.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
